<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Windows app icon, 40px and up: the clipboard as an object, no plate. -->
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3713F"/>
      <stop offset="1" stop-color="#694121"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFEF9"/>
      <stop offset="1" stop-color="#F4EDE0"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C4137"/>
      <stop offset="1" stop-color="#211A14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feOffset in="SourceAlpha" dy="3" result="offset"/>
      <feGaussianBlur in="offset" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#2A1709" flood-opacity="0.38"/>
      <feComposite in2="blur" operator="in" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="34" y="32" width="188" height="216" rx="26" fill="url(#board)"/>
  <rect x="35" y="33" width="186" height="214" rx="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="54" y="66" width="148" height="166" rx="6" fill="#E6D7BE" transform="rotate(-5 128 149)"/>
    <rect x="54" y="62" width="148" height="170" rx="6" fill="url(#paper)"/>
  </g>
  <rect x="72" y="96" width="70" height="12" rx="6" fill="#2C2418"/>
  <circle cx="78" cy="129" r="5.5" fill="#7A4F2B"/>
  <rect x="91" y="124.5" width="92" height="9" rx="4.5" fill="#D8C8AF"/>
  <circle cx="78" cy="153" r="5.5" fill="#7A4F2B"/>
  <rect x="91" y="148.5" width="76" height="9" rx="4.5" fill="#D8C8AF"/>
  <circle cx="78" cy="177" r="5.5" fill="#7A4F2B"/>
  <rect x="91" y="172.5" width="86" height="9" rx="4.5" fill="#D8C8AF"/>
  <rect x="72" y="196.5" width="56" height="9" rx="4.5" fill="#E5D9C5"/>
  <g filter="url(#shadow)">
    <path fill="url(#clip)" fill-rule="evenodd" d="M106 40 A22 22 0 0 1 150 40 V62 H106 Z M136 34 A8 8 0 1 0 120 34 A8 8 0 1 0 136 34 Z"/>
    <rect x="86" y="44" width="84" height="34" rx="11" fill="url(#clip)"/>
  </g>
  <rect x="94" y="49" width="68" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.14"/>
</svg>
