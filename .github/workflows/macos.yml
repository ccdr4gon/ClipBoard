name: macOS build and test
on:
  push:
    paths: ['src/**', 'tests/**', 'scripts/package-macos.py', '.github/workflows/macos.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/package-macos.py', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install media tools
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Test shared features and native macOS adapters
        run: dotnet run --project tests/ClipBoard.MacTests -- --native-smoke
      - name: Package Apple Silicon
        run: python3 scripts/package-macos.py --arch arm64
      - name: Package Intel
        run: python3 scripts/package-macos.py --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBoard-macOS
          path: dist/macos-*/*.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/ClipBoard.RegressionTests
